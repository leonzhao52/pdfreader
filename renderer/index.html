<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>PDF 阅读器</title>
  <!-- 样式文件 -->
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <!-- 应用容器 -->
  <div id="app">

    <!-- 顶部工具栏 -->
    <header id="toolbar" class="toolbar">
      <div class="toolbar-left">
        <!-- 打开文件按钮 -->
        <button id="btn-open" class="btn btn-icon" title="打开文件 (Ctrl+O)">
          <span class="icon">📂</span>
          <span class="text">打开</span>
        </button>

        <!-- 侧边栏切换按钮 -->
        <button id="btn-sidebar" class="btn btn-icon" title="切换侧边栏">
          <span class="icon">📑</span>
        </button>
      </div>

      <div class="toolbar-center">
        <!-- 翻页控制 -->
        <button id="btn-prev-page" class="btn btn-icon" title="上一页 (←)" disabled>
          <span class="icon">◀</span>
        </button>

        <!-- 页码显示与跳转 -->
        <div class="page-indicator">
          <input id="page-input" type="number" min="1" value="1" disabled>
          <span class="page-separator">/</span>
          <span id="page-total">0</span>
        </div>

        <button id="btn-next-page" class="btn btn-icon" title="下一页 (→)" disabled>
          <span class="icon">▶</span>
        </button>

        <!-- 缩放控制 -->
        <div class="zoom-controls">
          <button id="btn-zoom-out" class="btn btn-icon" title="缩小 (Ctrl+-)" disabled>
            <span class="icon">-</span>
          </button>

          <span id="zoom-level" class="zoom-level">100%</span>

          <button id="btn-zoom-in" class="btn btn-icon" title="放大 (Ctrl+=)" disabled>
            <span class="icon">+</span>
          </button>

          <button id="btn-zoom-fit" class="btn btn-text" title="适应页面" disabled>
            适应
          </button>
        </div>
      </div>

      <div class="toolbar-right">
        <!-- 双页模式切换 -->
        <button id="btn-dual-page" class="btn btn-text" title="双页模式" disabled>
          双页
        </button>

        <!-- 夜间模式切换 -->
        <button id="btn-theme" class="btn btn-icon" title="切换夜间模式">
          <span class="icon">🌙</span>
        </button>

        <!-- 全屏按钮 -->
        <button id="btn-fullscreen" class="btn btn-icon" title="全屏 (F11)">
          <span class="icon">⛶</span>
        </button>
      </div>
    </header>

    <!-- 主内容区 -->
    <main id="main-content" class="main-content">

      <!-- 侧边栏 -->
      <aside id="sidebar" class="sidebar">
        <!-- 侧边栏标签页 -->
        <div class="sidebar-tabs">
          <button class="tab-btn active" data-tab="thumbnails">缩略图</button>
          <button class="tab-btn" data-tab="files">文件</button>
        </div>

        <!-- 缩略图面板 -->
        <div id="thumbnails-panel" class="sidebar-panel active">
          <p class="empty-state">打开PDF文件后显示缩略图</p>
        </div>

        <!-- 文件列表面板 -->
        <div id="files-panel" class="sidebar-panel">
          <div class="panel-header">
            <h3>最近打开</h3>
            <button id="btn-clear-recent" class="btn btn-text btn-small">清空</button>
          </div>
          <ul id="recent-files-list" class="file-list">
            <li class="empty-state">暂无文件</li>
          </ul>
        </div>
      </aside>

      <!-- PDF显示区域 -->
      <section id="pdf-container" class="pdf-container">
        <!-- 欢迎页面（无文件时显示） -->
        <div id="welcome-screen" class="welcome-screen">
          <div class="welcome-content">
            <div class="welcome-icon">📄</div>
            <h2>欢迎使用 PDF 阅读器</h2>
            <p>轻量、快速、专注阅读体验</p>
            <button id="btn-welcome-open" class="btn btn-primary">打开 PDF 文件</button>
            <p class="welcome-hint">或将 PDF 文件拖拽到窗口</p>
          </div>
        </div>

        <!-- PDF渲染画布容器 -->
        <div id="pdf-viewer" class="pdf-viewer hidden">
          <!-- 单页模式 -->
          <canvas id="pdf-canvas"></canvas>
          <!-- 双页模式 - 右页 -->
          <canvas id="pdf-canvas-right" class="hidden"></canvas>
        </div>

        <!-- 加载进度指示器 -->
        <div id="loading-overlay" class="loading-overlay hidden">
          <div class="loading-spinner"></div>
          <p>正在加载...</p>
        </div>

        <!-- 错误提示 -->
        <div id="error-message" class="error-message hidden">
          <div class="error-content">
            <div class="error-icon">⚠️</div>
            <p id="error-text">加载失败</p>
            <button id="btn-error-close" class="btn btn-text">关闭</button>
          </div>
        </div>
      </section>
    </main>

    <!-- 底部状态栏 -->
    <footer id="status-bar" class="status-bar">
      <span id="status-text">就绪</span>
      <span id="file-info" class="file-info"></span>
    </footer>
  </div>

  <!-- PDF.js库 -->
  <script src="lib/pdfjs/pdf.min.js"></script>

  <!-- 应用脚本 -->
  <script src="js/pdf-viewer.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
